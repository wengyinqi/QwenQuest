# pip install pre-commit && pre-commit install
# Same ruff version as CI (.github/workflows/ci.yml) and pyproject's dev extra.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: local
    hooks:
      - id: version-consistency
        name: version consistency (scripts/release.py check)
        entry: python scripts/release.py check
        language: system
        pass_filenames: false
        files: ^(src/qwenquest/_version\.py|CHANGELOG\.md)$
