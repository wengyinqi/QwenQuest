name: Release

# Pushing a tag vX.Y.Z (after the version bump is merged) publishes a GitHub
# release whose notes are the matching CHANGELOG.md section.  See
# docs/versioning.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag, _version.py and CHANGELOG.md agree
        run: python scripts/release.py check --tag "${GITHUB_REF_NAME}"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Release notes from CHANGELOG.md
        run: python scripts/release.py notes "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "QwenQuest ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
