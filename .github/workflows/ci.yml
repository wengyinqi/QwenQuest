name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: "off"
  # CPU wheels keep the runners small; the code paths are identical on CUDA.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: _version.py, CHANGELOG.md (and the tag, on tag pushes) agree
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            python scripts/release.py check --tag "${GITHUB_REF_NAME}"
          else
            python scripts/release.py check
          fi

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url "$TORCH_INDEX"
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url "$TORCH_INDEX"
      - run: pip install -e ".[test]"
      - name: Unit, parity and end-to-end tests
        run: python -m pytest --cov --cov-report=term --cov-report=xml
      - name: CLI smoke test
        run: |
          qwenquest --version
          qwenquest info
          qwenquest demo --prompt-len 120 --new-tokens 6 --device-buffer-size 96
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  min-deps:
    name: Tests (oldest supported torch / safetensors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install "torch==2.2.2" --index-url "$TORCH_INDEX"
      - run: pip install "safetensors==0.4.0" "pytest>=8"
      - run: pip install --no-deps -e .
      # transformers is not installed here, so the HF parity tests skip.
      - run: python -m pytest

  build:
    name: Build & check distribution
    runs-on: ubuntu-latest
    needs: [lint, version]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install torch --index-url "$TORCH_INDEX"
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/qwenquest --version && /tmp/wheel-env/bin/qwenquest info
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
